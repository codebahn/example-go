name: Build Docker image

on:
  push:
    branches: ["*"]

jobs:
  build:
    runs-on: codebahn-small
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t myapp:${{ github.sha }} .

      # Uncomment to push to a container registry.
      # Add REGISTRY_USER and REGISTRY_PASSWORD as repository secrets.
      #
      # - name: Log in to registry
      #   run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.example.com -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      #
      # - name: Tag and push
      #   run: |
      #     docker tag myapp:${{ github.sha }} registry.example.com/myorg/myapp:${{ github.sha }}
      #     docker tag myapp:${{ github.sha }} registry.example.com/myorg/myapp:latest
      #     docker push registry.example.com/myorg/myapp:${{ github.sha }}
      #     docker push registry.example.com/myorg/myapp:latest

      - name: Smoke test
        run: |
          docker run -d --name smoketest -p 9090:8080 myapp:${{ github.sha }}
          for i in $(seq 1 10); do
            curl -sf http://localhost:9090/health && break
            sleep 1
          done
          docker stop smoketest
