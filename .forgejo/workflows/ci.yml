name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: codebahn-small
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    runs-on: codebahn-small
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t myapp:${{ github.sha }} .

      # Uncomment to push to the built-in Codebahn container registry.
      # No secrets needed; the built-in workflow token authenticates automatically.
      #
      # - name: Log in to registry
      #   run: echo "${{ github.token }}" | docker login codebahn.net -u "${{ github.actor }}" --password-stdin
      #
      # - name: Tag and push
      #   run: |
      #     image="codebahn.net/${{ github.repository }}"
      #     docker tag myapp:${{ github.sha }} "$image:${{ github.sha }}"
      #     docker tag myapp:${{ github.sha }} "$image:latest"
      #     docker push "$image:${{ github.sha }}"
      #     docker push "$image:latest"

      - name: Smoke test
        run: |
          docker run -d --name smoketest -p 9090:8080 myapp:${{ github.sha }}
          for i in $(seq 1 10); do
            curl -sf http://localhost:9090/health && break
            sleep 1
          done
          docker stop smoketest
