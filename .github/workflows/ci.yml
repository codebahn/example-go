name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t myapp:${{ github.sha }} .

      # Uncomment to push to the built-in Codebahn container registry.
      # No secrets needed; the built-in workflow token authenticates automatically.
      #
      # - name: Log in to registry
      #   run: echo "${{ github.token }}" | docker login codebahn.net -u "${{ github.actor }}" --password-stdin
      #
      # - name: Tag and push
      #   run: |
      #     image="codebahn.net/${{ github.repository }}"
      #     docker tag myapp:${{ github.sha }} "$image:${{ github.sha }}"
      #     docker tag myapp:${{ github.sha }} "$image:latest"
      #     docker push "$image:${{ github.sha }}"
      #     docker push "$image:latest"

      - name: Smoke test
        run: |
          set -euo pipefail

          # The job runs inside a container, so a published host port is not
          # reachable from here. Put the app and the probe on a shared network
          # and address the app by container name instead. Names are scoped to
          # the run id so concurrent runs on the same host cannot collide.
          net="smoke-${{ github.run_id }}"
          app="smoketest-${{ github.run_id }}"
          trap 'docker rm -f "$app" >/dev/null 2>&1 || true
                docker network rm "$net" >/dev/null 2>&1 || true' EXIT

          docker network create "$net"
          docker run -d --name "$app" --network "$net" myapp:${{ github.sha }}

          docker run --rm --network "$net" curlimages/curl:latest \
            --retry 10 --retry-delay 1 --retry-all-errors --retry-connrefused \
            -sf "http://${app}:8080/health" \
            || { echo "/health never responded" >&2; docker logs "$app" >&2; exit 1; }
